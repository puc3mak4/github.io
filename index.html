<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 强制IE使用最新渲染模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- ★★★ 核心：移动端视口配置（解决手机显示为电脑版的问题） ★★★ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 禁止手机浏览器自动识别数字为电话号码 -->
    <meta name="format-detection" content="telephone=no">
    
    <!-- 全屏模式下隐藏浏览器地址栏（部分手机支持） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>全屏嵌入</title>
    
    <style>
        /* 彻底重置内外边距，确保无空白 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;  /* 禁止滚动，避免出现白边 */
            background: #000;  /* 加载时的背景色 */
        }
        
        /* iframe 全屏填满 */
        iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100); /* 兼容移动端地址栏高度问题 */
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- 将 src="这里换成你的网址" -->
    <iframe src="https://www.tiktok.com/"></iframe>

    <script>
        // 解决移动端地址栏导致100vh偏大的问题（动态获取真实视口高度）
        function setRealHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setRealHeight();
        window.addEventListener('resize', setRealHeight);
        
        // 如果嵌入的网站不允许被iframe嵌套，会跳转失败，这是对方网站的限制
        // 部分浏览器（如iOS Safari）需额外处理，此脚本已覆盖
    </script>

</body>
</html>
